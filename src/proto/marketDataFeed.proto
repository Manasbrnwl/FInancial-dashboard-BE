syntax = "proto3";

package upstox.market_data;

// Market data feed structure
message FeedResponse {
  repeated Feed feeds = 1;
}

message Feed {
  FullFeed ff = 1;
  LTPC ltpc = 2;
}

// Full Feed - Complete market data
message FullFeed {
  MarketFF marketFF = 1;
  IndexFF indexFF = 2;
  OptionGreeks optionGreeks = 3;
  MarketLevel marketLevel = 4;
}

// Market Full Feed
message MarketFF {
  LTPC ltpc = 1;
  MarketOHLC marketOHLC = 2;
  Quote quote = 3;
  string instrument_key = 4;
  int64 last_trade_time = 5;
  OHLC ohlc = 6;
}

// Index Full Feed
message IndexFF {
  LTPC ltpc = 1;
  MarketOHLC marketOHLC = 2;
  string instrument_key = 3;
  int64 last_trade_time = 4;
}

// Last Traded Price/Close
message LTPC {
  double ltp = 1;
  int64 ltt = 2;
  double ltq = 3;
  double cp = 4;  // closing price
}

// Market OHLC
message MarketOHLC {
  repeated OHLC ohlc = 1;
}

// OHLC
message OHLC {
  string interval = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  int64 volume = 6;
  int64 ts = 7;
}

// Quotes for depth data
message Quote {
  repeated DepthQueue bids = 1;
  repeated DepthQueue asks = 2;
  int64 volume = 3;
  int64 oi = 4;
  double total_buy_qty = 5;
  double total_sell_qty = 6;
  double atp = 7;
}

// Depth Queue Entry
message DepthQueue {
  int32 bidQ = 1;
  double bidP = 2;
  int32 orders = 3;
  int32 askQ = 4;
  double askP = 5;
}

// Option Greeks
message OptionGreeks {
  double delta = 1;
  double theta = 2;
  double gamma = 3;
  double vega = 4;
  double iv = 5;
}

// Market Level - for level 2 data
message MarketLevel {
  repeated DepthQueue bids = 1;
  repeated DepthQueue asks = 2;
}
